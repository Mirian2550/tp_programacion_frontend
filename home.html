<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="home.css" />

    <title>Home</title>
  </head>
  <body>
    <header>
      <h1>Hola a todos!</h1>
      <img id="site-logo" src="images/logo.png" />
      <nav>
        <ul>
          <li><a href="#">Tu perfil</a></li>
          <li><a href="#">Agregar a tu log</a></li>
          <li><a href="#">Listas</a></li>
        </ul>
      </nav>
      <div class="topnav">
        <input type="text" placeholder="Buscar película" />
      </div>
    </header>
    <main>
      <div class="flex-container">
        <p class="vignette">
          <img class="resize" id="welcome-image" src="images/cine.jpg" />
        </p>
        <div class="center">¡BIENVENIDO A TU LOG DE PELÍCULAS EN ESPAÑOL!</div>
      </div>
      <div id="last-seen">LAS ÚLTIMAS QUE VISTE</div>
      <div class="flex-container-last-seen">
        <img
          class="item-1"
          src="images/lastseen/do-the-right-thing-md-web.jpg"
        />
        <img class="item-2" src="images/lastseen/mulholland-drive-md-web.jpg" />
        <img class="item-3" src="images/lastseen/paris-texas-md-web.jpg" />
        <img class="item-4" src="images/lastseen/the-big-lebowski-md-web.jpg" />
      </div>
    </main>
    <footer>
      <ul>
        <li>
          <a href="https://www.instagram.com" target="_blank">
            <img src="images/icons/insta.png" alt="instagram logo" />
          </a>
        </li>
        <li>
          <a href="https://www.facebook.com" target="_blank">
            <img src="images/icons/facebook.png" alt="facebook logo" />
          </a>
        </li>
      </ul>
      <ul>
        <li>
          <a href="https://x.com/?lang=es" target="_blank">
            <img src="images/icons/insta.png" alt="twitter logo" />
          </a>
        </li>
      </ul>
    </footer>
  </body>
</html>
